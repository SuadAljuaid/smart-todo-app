<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيق قائمة المهام الذكي</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h2>قائمة المهام الذكية 📝</h2>

    <!-- شريط الإدخال -->
    <div class="input-section">
      <input type="text" id="taskInput" placeholder="أضف مهمة جديدة...">
      <button id="addBtn">إضافة</button>
    </div>

    <!-- أدوات الفلترة وشريط التقدم -->
    <div class="filter-section">
      <button onclick="filterTasks('all')">الكل</button>
      <button onclick="filterTasks('pending')">قيد الانتظار</button>
      <button onclick="filterTasks('completed')">المكتملة</button>
    </div>

    <!-- قائمة عرض المهام -->
    <ul id="taskList"></ul>
  </div>

  <script src="app.js"></script>
</body>
</html>
